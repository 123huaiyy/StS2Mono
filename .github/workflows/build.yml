name: Build StS2Mono

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh
        env:
          BRIDGE_VERSION: ${{ github.run_number }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StS2Mono
          path: out/
